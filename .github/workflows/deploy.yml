name: deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly external link check: it reports in an issue (the links job) and never deploys
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded PR builds, never an in-flight deploy
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump both together: the checksum is hugo_${HUGO_VERSION}_linux-amd64.tar.gz in the release's checksums file.
  # Keep mise.toml on the same version for local builds (`mise use hugo@<version>`).
  HUGO_VERSION: 0.170.1
  HUGO_SHA256: 841a5462853aefc9942e4de1e8a5d75584b6a5181941e6ad3f1d745190e03cd8

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # Chromium and its system libraries download on every run
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      links: ${{ steps.links.outputs.exit_code }}
      report: ${{ steps.report.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Hugo
        run: |
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -sfL --output-dir "$RUNNER_TEMP" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${tarball}"
          echo "${HUGO_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -C "$RUNNER_TEMP/hugo" -xf "$RUNNER_TEMP/${tarball}" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      # The diagrams are drawn here, on every build, by the site's own Mermaid in Chromium
      # (scripts/diagrams.py), so a drawing never outlives a change to the palette, the code
      # font or Mermaid. Nothing is cached: Playwright advises against caching browsers, and a
      # cache a pull request can read is one it can poison.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.8"
          python-version: "3.12"
          enable-cache: false

      - name: Install Chromium
        run: uv run --with playwright==1.48.0 playwright install --with-deps chromium

      - name: Draw diagrams
        run: uv run --with playwright==1.48.0 python3 scripts/diagrams.py

      # Stops if a diagram was not drawn (layouts/_markup/render-codeblock-mermaid.html)
      - name: Build
        run: hugo build --gc --minify --panicOnWarning

      # Internal links on every run, and a broken one stops it. The weekly run checks external
      # sites too, and doesn't stop: the links job reports what it found in an issue.
      - name: Check links
        id: links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml --no-progress
            ${{ github.event_name != 'schedule' && '--offline' || '' }}
            --root-dir ${{ github.workspace }}/public
            --remap 'https://codeafterdark\.dev/ file://${{ github.workspace }}/public/'
            public
          fail: ${{ github.event_name != 'schedule' }}
          jobSummary: true

      - name: Keep the link report
        id: report
        if: github.event_name == 'schedule'
        run: |
          eof="EOF_$(openssl rand -hex 8)"
          { echo "report<<$eof"; cat lychee/out.md; echo "$eof"; } >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the Pages deployment
      id-token: write # OIDC token that deploy-pages uses to verify the deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The weekly link check's report: one "Broken links" issue, opened when a link breaks, kept
  # up to date while any stay broken, and closed once they're all fixed
  links:
    name: links
    if: github.event_name == 'schedule'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open, update and close the "Broken links" issue
    steps:
      - name: Report broken links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXIT_CODE: ${{ needs.build.outputs.links }}
          REPORT: ${{ needs.build.outputs.report }}
        run: |
          title="Broken links"
          open=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          case "$EXIT_CODE" in
            0)
              if [ -n "$open" ]; then
                gh issue close "$open" --comment "The weekly link check found no broken links: $run"
              fi
              ;;
            2)
              printf '%s\n\nFound by the weekly link check: %s\n' "$REPORT" "$run" > body.md
              if [ -n "$open" ]; then
                gh issue edit "$open" --body-file body.md
              else
                gh issue create --title "$title" --body-file body.md
              fi
              ;;
            *)
              echo "::error::The link check itself failed (lychee exit code '$EXIT_CODE'): $run"
              exit 1
              ;;
          esac
