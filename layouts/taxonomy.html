{{ define "main" }}
<div class="col">
  <header class="page-head">
    <h1>{{ .Title | lower }}</h1>
    <p class="page-sub">{{ len .Data.Terms }} {{ cond (eq (len .Data.Terms) 1) (.Data.Singular | lower) (.Data.Plural | lower) }}, most used first.</p>
  </header>
  <ul class="terms">
    {{- range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}"><span><span class="th" aria-hidden="true">#</span>{{ .Page.LinkTitle | lower }}</span><span>{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
</div>
{{ end }}
