{{ define "main" }}

  {{ partial "strip.html" "" }}
  <p class="page-sub">The link may be old, or the post may have moved. Try one of these instead:</p>
  <ul class="lost-links">
    <li><a href="{{ "/" | relURL }}">Latest posts</a></li>
    <li><a href="{{ "archives/" | relURL }}">The archive</a></li>
    <li><a href="{{ "search/" | relURL }}">Search</a></li>
  </ul>
</header>
{{ end }}
