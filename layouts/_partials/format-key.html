{{- /* The format strip as a legend: one bar per format, linking to its list. */ -}}
<nav class="key" aria-label="Formats">
  {{- range sort hugo.Data.formats "order" }}
  {{- $n := len (index site.Taxonomies.formats .slug) }}
  {{- if $n }}
  <a class="key-item h-{{ .hue }}" href="{{ printf "/formats/%s/" .slug | relURL }}"><span class="key-bar"></span><span class="key-name">{{ .plural }}<span class="key-count">{{ $n }}</span></span></a>
  {{- else }}
  <span class="key-item is-empty h-{{ .hue }}"><span class="key-bar"></span><span class="key-name">{{ .plural }}<span class="key-count">0</span></span></span>
  {{- end }}
  {{- end }}
</nav>
