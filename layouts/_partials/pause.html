{{- /* The one pause control: it stops every motion on the page (the windows across the
       street, the beacon, the caret, the steam, the zzz, the room after dark) and is
       remembered. site.js shows it; without JavaScript nothing moves, so there is nothing
       to pause. */ -}}
<button class="pause" type="button" hidden><svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg><svg class="i-play" viewBox="0 0 16 16" aria-hidden="true" focusable="false" fill="currentColor"><path d="M5 3.2v9.6L12.6 8z"/></svg><span>pause motion</span></button>
