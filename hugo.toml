baseURL = 'https://codeafterdark.dev/'
locale = 'en-US'
# Dates without an offset (e.g. content/about.md) are Eastern, like the rest
timeZone = 'America/New_York'
title = 'code after dark'
enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true
summaryLength = 40
# List titles as written ("tags", "aws"): the site's own titles are lowercase, like its name
capitalizeListTitles = false

[minify]
disableXML = true
minifyOutput = true

[params]
description = 'Code, cloud, and late-night thoughts.'
author = 'Jacob Lineberry'
mainSections = ['posts']
# The home page's line under the tagline, in Markdown; the name links to the about page.
intro = 'Hi, I’m [Jacob](/about/). This is where I write about Go, the terminal, distributed systems, and the network underneath it all.'
dateFormat = 'Jan 2, 2006'
rssLimit = 20
keywords = ['Go', 'Distributed systems', 'Production engineering', 'Linux', 'Kubernetes', 'gRPC', 'AWS']
# The card a shared link shows (1200 x 630): the room and the wordmark, drawn by
# scripts/card.py from the site itself. A post can name its own with `images` in front matter.
images = ['/images/card.png']

# Links: the row under the intro on the home page, at the end of every post and on the about
# page, in this order: the work, then the ways to reach me, the professional profile last.
# Each has its icon (layouts/_partials/icon.html) and its name as the label. The feed has
# its own link (subscribe.html). No analytics, comments or share widgets: see PRODUCT.md.
[[params.links]]
name = 'GitHub'
url = 'https://github.com/jacob-lineberry'

[[params.links]]
name = 'Email'
url = 'mailto:jacob@codeafterdark.dev'

# Discord: an invite that never expires.
[[params.links]]
name = 'Discord'
url = 'https://discord.gg/ECkxVNADnq'

[[params.links]]
name = 'LinkedIn'
url = 'https://www.linkedin.com/in/jacoblineberry/'

[markup]
defaultMarkdownHandler = 'goldmark'

[markup.goldmark.extensions]
definitionList = true
footnote = true
linkify = true
linkifyProtocol = 'https'
strikethrough = true
table = true
taskList = true
typographer = true

[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = 'github'
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.renderer]
hardWraps = false
unsafe = true

[markup.highlight]
codeFences = true
guessSyntax = false
lineNos = false
noClasses = false
tabWidth = 2

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

# "updated" comes from a post's own `lastmod`, never from git: a commit that fixes a typo or a
# template isn't new writing.
[frontmatter]
lastmod = ['lastmod', 'date']

# A post's address is its file name (or folder, for a post with its own images), or a `slug` in
# its front matter: never its title, so a post can be retitled without breaking its links
[permalinks.page]
posts = '/:year/:slugorcontentbasename/'

[permalinks.term]
tags = '/tags/:slug/'

# Tags only: posts are grouped by what they are about, not into categories
[taxonomies]
tag = 'tags'

[[menus.main]]
name = 'Posts'
url = '/'
weight = 10

[[menus.main]]
name = 'Archive'
url = '/archives/'
weight = 20

[[menus.main]]
name = 'About'
url = '/about/'
weight = 30

# One feed, the home page's, of every post (layouts/home.rss.xml); the lists have no feeds
# of their own, so a reader can't subscribe to one that stays empty
[outputs]
home = ['HTML', 'RSS', 'JSON']
section = ['HTML']
taxonomy = ['HTML']
term = ['HTML']

[privacy.youtube]
privacyEnhanced = true

[sitemap]
changefreq = 'weekly'
filename = 'sitemap.xml'
priority = 0.5

# Nothing runs as an external process: js.Build uses Hugo's built-in esbuild
[security.exec]
allow = []

[security.funcs]
getenv = ['^HUGO_', '^CI$']
