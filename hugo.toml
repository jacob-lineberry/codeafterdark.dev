baseURL = 'https://codeafterdark.dev/'
locale = 'en-US'
# Dates without an offset (e.g. content/about.md) are Eastern, like the rest
timeZone = 'America/New_York'
title = 'code after dark'
enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false
pygmentsUseClasses = true
summaryLength = 40

[minify]
disableXML = true
minifyOutput = true

[params]
description = 'Code, cloud, and late-night thoughts.'
author = 'Jacob Lineberry'
mainSections = ['posts']
# The home page's second line: "<author> writes about <writesAbout>."
writesAbout = 'cloud infrastructure, platform engineering and networking'
dateFormat = 'Jan 2, 2006'
rssLimit = 20
keywords = ['DevOps', 'Platform engineering', 'Cloud', 'Kubernetes', 'Architecture', 'Networking', 'CI/CD']
# Default social card. Add static/images/og-default.png (1200x630) to enable it.
# images = ['/images/og-default.png']

# Where "Suggest an edit" links point.
editURL = 'https://github.com/jacob-lineberry/codeafterdark.dev/edit/main/content/'
# Where the "history" link and the rev hash in each post's memo row point.
historyURL = 'https://github.com/jacob-lineberry/codeafterdark.dev/commits/main/content/'
commitURL = 'https://github.com/jacob-lineberry/codeafterdark.dev/commit/'

# Links: the row under the subtitle on the home page, in this order (rss is added at the
# end). No analytics, comments or share widgets: see PRODUCT.md.
[[params.links]]
name = 'GitHub'
url = 'https://github.com/jacob-lineberry'

[[params.links]]
name = 'LinkedIn'
url = 'https://www.linkedin.com/in/jacoblineberry/'

[[params.links]]
name = 'Email'
url = 'mailto:jacob@codeafterdark.dev'

# Discord, when there is an invite link: uncomment and fill in the URL.
# [[params.links]]
# name = 'Discord'
# url = 'https://discord.gg/...'

[markup]
defaultMarkdownHandler = 'goldmark'

[markup.goldmark.extensions]
definitionList = true
footnote = true
linkify = true
linkifyProtocol = 'https'
strikethrough = true
table = true
taskList = true
typographer = true

[markup.goldmark.parser]
autoHeadingID = true
autoHeadingIDType = 'github'
wrapStandAloneImageWithinParagraph = false

[markup.goldmark.parser.attribute]
block = true
title = true

[markup.goldmark.renderer]
hardWraps = false
unsafe = true

[markup.highlight]
codeFences = true
guessSyntax = false
lineNos = false
noClasses = false
tabWidth = 2

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[permalinks.page]
posts = '/:year/:slug/'

[permalinks.term]
tags = '/tags/:slug/'
categories = '/categories/:slug/'

[taxonomies]
category = 'categories'
tag = 'tags'

[[menus.main]]
name = 'Posts'
url = '/'
weight = 10

[[menus.main]]
name = 'Archive'
url = '/archives/'
weight = 20

[[menus.main]]
name = 'About'
url = '/about/'
weight = 30

[outputs]
home = ['HTML', 'RSS', 'JSON']

[privacy.youtube]
privacyEnhanced = true

[sitemap]
changefreq = 'weekly'
filename = 'sitemap.xml'
priority = 0.5

# Only git (enableGitInfo) runs as an external process; js.Build uses Hugo's built-in esbuild
[security.exec]
allow = ['^git$']

[security.funcs]
getenv = ['^HUGO_', '^CI$']
