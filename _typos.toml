# typos reads the hex in @font-face unicode-range values (U+0100-02BA) as words
[default]
extend-ignore-re = ["U\\+[0-9A-Fa-f]+(-[0-9A-Fa-f]+)?"]

# a variable font's width axis, in the names of the fonts scripts/fallbacks.py measures
[default.extend-words]
wdth = "wdth"

# third-party code, copied in unchanged (static/vendor/*/README.md)
[files]
extend-exclude = ["static/vendor/"]
