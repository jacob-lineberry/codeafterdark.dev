# Post formats. Each post sets one in front matter:  formats = ['war-story']
# The order here is the order of the format key strip under every title.
# `hue` names a colour token in assets/css/main.css.

[deep-dive]
slug = 'deep-dive'
name = 'Deep dive'
plural = 'Deep dives'
hue = 'cyan'
blurb = 'Long-form write-ups: how it works, how I built it.'
order = 1

[war-story]
slug = 'war-story'
name = 'War story'
plural = 'War stories'
hue = 'magenta'
blurb = 'Weird failures, debugging at odd hours, and what they taught me.'
order = 2

[note]
slug = 'note'
name = 'Note'
plural = 'Notes'
hue = 'yellow'
blurb = 'Short findings, snippets and things I learned today.'
order = 3

[essay]
slug = 'essay'
name = 'Essay'
plural = 'Essays'
hue = 'green'
blurb = 'Opinions on architecture, careers and the craft.'
order = 4
